---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-service
  namespace: collaboration
  labels:
    app: messaging-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: messaging-service
  template:
    metadata:
      labels:
        app: messaging-service
    spec:
      containers:
        - name: messaging-service
          image: collaboration/messaging-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: PORT
              value: "3002"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: messaging-service
  namespace: collaboration
  labels:
    app: messaging-service
spec:
  selector:
    app: messaging-service
  ports:
    - port: 3002
      targetPort: 3002
  type: ClusterIP